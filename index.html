<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Overtime Portal</title>
<style>
:root{--bg:#f3f5f7;--card:#fff;--tx:#1b2a33;--ac:#0e8a8a;--bd:#9aa7ad}
*{box-sizing:border-box}body{margin:0;font:14px Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--tx)}
.card{background:var(--card);border-radius:10px;padding:16px;margin:12px auto;max-width:1100px;box-shadow:0 1px 4px #0002}
button{background:var(--ac);color:#fff;border:0;padding:8px 14px;border-radius:6px;cursor:pointer;font-size:13px;margin:2px}
button.g{background:#6b7b84}button.r{background:#c0392b}
input,select{padding:6px;border:1px solid var(--bd);border-radius:5px;font:inherit}
#login{max-width:340px;margin:80px auto}#login input{width:100%;margin:6px 0}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.err{color:#c0392b}[hidden]{display:none!important}
table{border-collapse:collapse;width:100%}
#sheet{background:#fff;max-width:1100px;margin:12px auto;padding:10px;border:2px solid #000;overflow-x:auto}
#sheet th,#sheet td{border:1px solid #000;padding:2px 4px;text-align:center;font-size:12px;height:24px}
#sheet input{border:0;padding:0;width:100%;text-align:center;background:transparent;font-size:12px}
#sheet input[type=checkbox]{width:auto}
.hd{display:flex;justify-content:space-between;border:2px solid #000;padding:6px;margin-bottom:6px}
.logo{font-size:30px;font-weight:800;color:#0e8a8a}
.f{display:grid;grid-template-columns:1fr 1fr;gap:6px 24px;margin:8px 0}
.f div{display:flex;gap:6px;align-items:end;border-bottom:1px solid #000;min-height:26px}
.f b{font-size:11px;white-space:nowrap}.f input{flex:1;text-align:left!important;font-weight:600}
.sg{height:40px;max-width:160px}
.sun td{background:#fff3e0}.tot td{font-weight:700}
#pad{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center}
#pad canvas{background:#fff;border:1px solid #000;touch-action:none}
@media print{body{background:#fff}.noprint,#hdr{display:none!important}
#sheet{margin:0;border:0;max-width:none;padding:0}@page{size:A4 portrait;margin:8mm}
#sheet th,#sheet td{font-size:9px;height:18px}}
</style></head><body>

<div id="login" class="card"><h2>Overtime Portal</h2>
<input id="em" type="email" placeholder="Email"><input id="pw" type="password" placeholder="Password">
<button onclick="login()" style="width:100%">Sign in</button><p id="lerr" class="err"></p></div>

<div id="app" hidden>
<div id="hdr" class="card bar"><b id="who"></b>
<span>
<select id="mon" onchange="refresh()"></select>
<input id="yr" type="number" style="width:80px" onchange="refresh()">
<button id="t1" class="g" onclick="loadList()" hidden>Timesheets</button>
<button id="t2" class="g" onclick="showStaff()" hidden>Staff</button>
<button class="r" onclick="auth.signOut()">Log out</button></span></div>
<div id="list" class="card" hidden></div>
<div id="staff" class="card" hidden>
<h3>Create user</h3>
<div class="bar" style="justify-content:flex-start">
<input id="nn" placeholder="Full name"><input id="ne" placeholder="Employee no.">
<input id="nm" type="email" placeholder="Email"><input id="np" type="text" placeholder="Temp password (6+)">
<select id="nr"><option value="employee">Employee</option><option value="manager">Manager</option></select>
<button onclick="mkUser()">Create</button></div><p id="smsg"></p><div id="slist"></div></div>
<div id="bar" class="card noprint" hidden></div>
<div id="sheet" hidden></div>
</div>
<div id="pad" hidden><div style="background:#fff;padding:12px;border-radius:8px">
<canvas id="cv" width="420" height="160"></canvas><br>
<button onclick="padSave()">Save signature</button><button class="g" onclick="padClear()">Clear</button><button class="r" onclick="$('pad').hidden=true">Cancel</button></div></div>

<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-app-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-auth-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig={apiKey:"YOUR_API_KEY",authDomain:"YOUR_PROJECT.firebaseapp.com",projectId:"YOUR_PROJECT",appId:"YOUR_APP_ID"};
const OT_THRESHOLD=195, NIGHT_DOUBLE_CAP=6;
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(),db=firebase.firestore(),$=id=>document.getElementById(id);
const MON=["January","February","March","April","May","June","July","August","September","October","November","December"];
const DAY=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
let me,cur,staff={},P={y:new Date().getFullYear(),m:new Date().getMonth()};
$('mon').innerHTML=MON.map((n,i)=>`<option value="${i}">${n}</option>`).join('');
$('mon').value=P.m;$('yr').value=P.y;

function login(){$('lerr').textContent='';auth.signInWithEmailAndPassword($('em').value,$('pw').value).catch(e=>$('lerr').textContent=e.message)}
auth.onAuthStateChanged(async u=>{
 if(!u){me=null;$('app').hidden=true;$('login').hidden=false;return}
 const s=await db.collection('users').doc(u.uid).get();
 if(!s.exists){$('lerr').textContent='Account not set up. Contact management.';auth.signOut();return}
 me={uid:u.uid,...s.data()};$('who').textContent=`${me.name} (${me.role})`;
 $('login').hidden=true;$('app').hidden=false;
 const mg=me.role=='manager';$('t1').hidden=$('t2').hidden=!mg;
 mg?loadList():openSheet(me.uid);
});
function view(v){['list','staff'].forEach(x=>$(x).hidden=x!=v);if(!v||v=='staff'){$('sheet').hidden=$('bar').hidden=true}}
function refresh(){P.m=+$('mon').value;P.y=+$('yr').value;me.role=='manager'&&!cur?loadList():(me.role=='manager'&&$('list').hidden==false?loadList():openSheet(cur?cur.d.uid:me.uid))}

async function loadList(){
 cur=null;view('list');P.m=+$('mon').value;P.y=+$('yr').value;
 const us=await db.collection('users').get();staff={};us.forEach(d=>staff[d.id]=d.data());
 const ts=await db.collection('timesheets').where('ym','==',`${P.y}-${P.m+1}`).get();
 const st={};ts.forEach(d=>st[d.data().uid]=d.data().status);
 $('list').innerHTML=`<h3>${MON[P.m]} ${P.y}</h3><table>`+Object.entries(staff).filter(([,s])=>s.role!='manager').map(([id,s])=>
  `<tr><td>${s.name}</td><td>${s.empNo||''}</td><td>${st[id]||'no sheet'}</td><td><button onclick="openSheet('${id}')">Open</button></td></tr>`).join('')+'</table>';
}
function showStaff(){cur=null;view('staff');db.collection('users').get().then(us=>{
 $('slist').innerHTML='<table>'+us.docs.map(d=>`<tr><td>${d.data().name}</td><td>${d.data().empNo||''}</td><td>${d.data().email}</td><td>${d.data().role}</td></tr>`).join('')+'</table>'})}
async function mkUser(){
 try{const app=firebase.apps.find(a=>a.name=='sec')||firebase.initializeApp(firebaseConfig,'sec');
 const c=await app.auth().createUserWithEmailAndPassword($('nm').value,$('np').value);
 await db.collection('users').doc(c.user.uid).set({name:$('nn').value,empNo:$('ne').value,email:$('nm').value,role:$('nr').value});
 await app.auth().signOut();$('smsg').textContent='User created.';showStaff()}catch(e){$('smsg').textContent=e.message}}

async function openSheet(uid){
 view(null);P.m=+$('mon').value;P.y=+$('yr').value;
 const prof=uid==me.uid?me:(staff[uid]||(await db.collection('users').doc(uid).get()).data());
 const id=`${uid}_${P.y}-${P.m+1}`,s=await db.collection('timesheets').doc(id).get();
 cur={id,prof,d:s.exists?s.data():{uid,ym:`${P.y}-${P.m+1}`,e:{},status:'draft',auth:'',mgrName:me.role=='manager'?me.name:''}};
 render();
}
const ed=()=>me.role=='manager'||!['submitted','approved'].includes(cur.d.status);
const T=t=>{if(!t)return null;const[h,m]=t.split(':').map(Number);return h*60+m};
function calc(d,e){
 const s=T(e.s),n=T(e.e);if(s==null||n==null)return null;
 let h=(n-s)/60;if(h<=0)h+=24;
 const dow=new Date(P.y,P.m,d).getDay(),night=s>n||s>=1080;let dbl=0;
 if(night){if(dow==0||dow==6||e.ph)dbl=Math.min(NIGHT_DOUBLE_CAP,h)}else if(dow==0||e.ph)dbl=h;
 return{h,dbl,ph:e.ph?h:0,ni:night?h:0}}
const f=n=>n?n.toFixed(2):'';
function render(){
 const E=ed(),n=new Date(P.y,P.m+1,0).getDate(),p=cur.prof,d=cur.d;let r='';
 for(let i=1;i<=n;i++){const e=d.e[i]||{},w=new Date(P.y,P.m,i).getDay();
  r+=`<tr class="${w==0?'sun':''}"><td>${i}-${MON[P.m].slice(0,3)}-${String(P.y).slice(2)}</td><td>${DAY[w]}</td>
  <td><input type="time" data-d="${i}" data-k="s" value="${e.s||''}" ${E?'':'disabled'} oninput="chg(this)"></td>
  <td><input type="time" data-d="${i}" data-k="e" value="${e.e||''}" ${E?'':'disabled'} oninput="chg(this)"></td>
  <td id="h${i}"></td><td id="d${i}"></td><td></td>
  <td><input type="checkbox" data-d="${i}" data-k="ph" ${e.ph?'checked':''} ${E?'':'disabled'} onchange="chg(this)"></td>
  <td id="n${i}"></td><td><input data-d="${i}" data-k="r" value="${e.r||''}" ${E?'':'disabled'} oninput="chg(this)"></td></tr>`}
 const sig=(k)=>d[k]?`<img class="sg" src="${d[k]}">`:'';

function chg(el){const i=el.dataset.d,k=el.dataset.k;(cur.d.e[i]=cur.d.e[i]||{})[k]=k=='ph'?el.checked:el.value;recompute()}
function recompute(){
 const n=new Date(P.y,P.m+1,0).getDate();let H=0,D=0,PH=0,N=0;
 for(let i=1;i<=n;i++){const c=calc(i,cur.d.e[i]||{});
  $('h'+i).textContent=c?f(c.h):'';$('d'+i).textContent=c?f(c.dbl):'';$('n'+i).textContent=c?f(c.ni):'';
  if(c){H+=c.h;D+=c.dbl;PH+=c.ph;N+=c.ni}}
 const o15=Math.max(0,H-D-OT_THRESHOLD);
 $('TH').textContent=H.toFixed(2);$('TD').textContent=D.toFixed(2);$('T15').textContent=o15.toFixed(2);$('TP').textContent=PH.toFixed(2);$('TN').textContent=N.toFixed(2);
}
const say=t=>$('msg').textContent=t;
async function save(){await db.collection('timesheets').doc(cur.id).set(cur.d);say('Saved ✔')}
async function submitS(){if(!cur.d.empSig)return say('Please sign first.');
 cur.d.status='submitted';cur.d.subDate=new Date().toISOString().slice(0,10);await save();render()}
async function approve(){if(!cur.d.mgrSig)return say('Manager signature required.');if(!cur.d.auth)return say('Select overtime authorised YES/NO.');
 cur.d.status='approved';await save();render()}
async function ret(){cur.d.status='draft';cur.d.mgrSig='';await save();render()}

let key,drawing=false;const cv=$('cv'),cx=cv.getContext('2d');
function pad(k){key=k;padClear();$('pad').hidden=false}
function padClear(){cx.clearRect(0,0,cv.width,cv.height)}
function padSave(){cur.d[key]=cv.toDataURL();$('pad').hidden=true;const s=cur.d.status,e=cur.d.e;render()}
const pos=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
cv.onpointerdown=e=>{drawing=true;cx.beginPath();cx.moveTo(...pos(e))};
cv.onpointermove=e=>{if(drawing){cx.lineWidth=2;cx.lineTo(...pos(e));cx.stroke()}};
cv.onpointerup=cv.onpointerleave=()=>drawing=false;
