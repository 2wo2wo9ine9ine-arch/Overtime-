<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Overtime Portal</title>
<style>
:root{--bg:#eef1f4;--ink:#0f2a33;--tx:#1b2a33;--mu:#64748b;--ac:#0e7c86;--ac2:#0a5c64;--bd:#d5dce2}
*{box-sizing:border-box}body{margin:0;padding-bottom:96px;font:14px/1.45 "Segoe UI",system-ui,Arial,sans-serif;background:var(--bg);color:var(--tx)}
.card{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:18px;margin:14px auto;max-width:1100px;box-shadow:0 1px 3px #0f172a14;overflow-x:auto}
button{background:var(--ac);color:#fff;border:0;padding:9px 16px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13px;margin:2px}
button:hover{background:var(--ac2)}button.o{background:#fff;color:var(--ac);border:1px solid var(--ac)}button.r{background:#b91c1c}button.g{background:#475569}
input,select{padding:9px 10px;border:1px solid var(--bd);border-radius:8px;font:inherit;background:#fff}
input:focus,select:focus{outline:2px solid #0e7c8655;border-color:var(--ac)}
.err{color:#b91c1c}.mu{color:var(--mu)}[hidden]{display:none!important}
#login{max-width:360px;margin:12vh auto}#login input{width:100%;margin:6px 0}
#top{background:var(--ink);color:#fff;padding:12px 16px 14px}
.tb{display:flex;justify-content:space-between;align-items:center;max-width:1100px;margin:0 auto 10px}.brand{font-size:18px}#who{font-size:12px;opacity:.8}
.dp{display:flex;justify-content:center;align-items:center;gap:6px;margin-bottom:12px}.dp input{width:88px}.dp select{min-width:130px}
.arr{background:#ffffff22;padding:8px 14px;font-size:16px}
#tiles{display:flex;gap:10px;max-width:1100px;margin:0 auto}
.tile{flex:1;text-align:center;padding:14px 8px;border-radius:12px;background:#1f4654;color:#cfe3e8;font-weight:600;cursor:pointer;border-bottom:4px solid transparent}
.tile.on{background:#0e8a94;color:#fff;border-bottom-color:#7fe3ea;box-shadow:0 4px 10px #0006}
h3{margin:0 0 12px}.bar2{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.dt{width:100%;border-collapse:collapse;min-width:520px}.dt th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mu);padding:8px 10px;border-bottom:2px solid var(--bd)}
.dt td{padding:10px;border-bottom:1px solid #e8edf1}.dt tr:hover td{background:#f8fafc}
.b{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;background:#e2e8f0;color:#334155}
.b.submitted{background:#fef3c7;color:#92400e}.b.approved{background:#d1fae5;color:#065f46}.b.draft{background:#e0e7ff;color:#3730a3}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}.fg input,.fg select{width:100%}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}.stat{flex:1;min-width:100px;background:#f1f5f9;border-radius:10px;padding:10px 14px}.stat b{display:block;font-size:22px}.stat span{font-size:12px;color:var(--mu)}
.cg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.ch{text-align:center;font-size:11px;font-weight:700;color:var(--mu)}
.cd{cursor:pointer;min-height:54px;border:1px solid var(--bd);border-radius:8px;padding:4px;font-size:12px;overflow:hidden;background:#fafbfc}.cd.su{background:#fff3e0}.cd.w{background:#d8f1f3;border-color:var(--ac)}.cd.td{outline:2px solid var(--ac)}.cd b{display:block;font-size:10.5px;color:var(--ac2)}
#bar{display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:12px 16px}.grp{display:flex;gap:4px;padding-right:14px;border-right:1px solid var(--bd)}.sh{margin-left:auto}.hint{flex-basis:100%;color:var(--mu);font-size:12px}
#sheet{background:#fff;max-width:1100px;margin:14px auto;padding:12px;border:1px solid var(--bd);border-radius:12px;overflow-x:auto;box-shadow:0 1px 3px #0f172a14}
#sheet table{min-width:760px;width:100%;border-collapse:collapse}
#sheet th,#sheet td{border:1px solid #000;padding:2px 4px;text-align:center;font-size:12px;height:26px}
#sheet th{background:#e6f2f3}
#sheet td input{border:0;padding:0;width:100%;min-width:62px;text-align:center;background:transparent;font-size:13px;border-radius:0}
#sheet input[type=checkbox]{width:auto;min-width:0}
.hd{display:flex;justify-content:space-between;align-items:center;border:2px solid #000;padding:6px;margin-bottom:6px}
.f{display:grid;grid-template-columns:1fr 1fr;gap:6px 22px;margin:8px 0}.f>div{display:flex;gap:8px;align-items:center}.f b{width:120px;font-size:10px;flex:none}
.g{flex:1;background:#d9dde0;padding:5px 8px;min-height:28px;font-weight:600;border:0;border-radius:2px;font-size:13px}
.sg{height:34px;max-width:150px;display:block}
.sun td{background:#fff3e0}.tot td{font-weight:700;background:#f1f5f9}
#nav{position:fixed;left:0;right:0;bottom:0;height:62px;background:var(--ink);z-index:8}
.hm{position:absolute;left:50%;transform:translateX(-50%);top:-22px}
#homeB{width:66px;height:66px;border-radius:50%;background:var(--ac);border:5px solid var(--bg);padding:0;box-shadow:0 4px 10px #0005;display:flex;align-items:center;justify-content:center;margin:0}
.bk{position:absolute;left:calc(100% + 4px);top:30px;background:#1f4654;padding:8px 12px;white-space:nowrap}
.out{position:absolute;right:12px;top:12px;background:#b91c1c}
#pad,#shr,#dm{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;z-index:9}
#pad canvas{background:#fff;border:1px solid #000;touch-action:none;max-width:100%}
.mdl{background:#fff;padding:18px;border-radius:12px;display:flex;flex-direction:column;gap:6px;min-width:260px}.mdl button{padding:12px}
@media(max-width:600px){.f{grid-template-columns:1fr}.grp{border:0}}
.chip{display:inline-block;background:#e6f2f3;color:var(--ac2);padding:5px 12px;border-radius:99px;margin:4px 4px 0 0;font-weight:600;font-size:12px;cursor:pointer}
.mdl label{display:flex;flex-direction:column;gap:3px;font-weight:600;font-size:12px}
.pp{background:#fff;color:#000;font:10px/1.3 "Segoe UI",Arial,sans-serif;width:100%}
.pp .hd{display:flex;justify-content:space-between;align-items:center;border:2px solid #000;padding:3px 6px;margin:0 0 4px}.pp .hd img{height:46px}
.pp h2{text-align:center;font-size:15px;margin:3px 0}
.pp .f{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px;margin:4px 0}.pp .f>div{display:flex;gap:6px;align-items:center}
.pp .f b{width:92px;font-size:8px;flex:none}
.pp .g{flex:1;display:block;background:#d9dde0;padding:2px 6px;min-height:20px;font-size:10px;font-weight:600}
.pp .sg{height:22px}.pp table{width:100%;border-collapse:collapse;min-width:0}
.pp th,.pp td{border:1px solid #000;padding:0 3px;font-size:8.5px;height:16px;text-align:center}.pp th{background:#e6f2f3}
.pp .sun td{background:#fff3e0}.pp .tot td{font-weight:700;background:#f1f5f9}
#pv{display:none}
@media print{@page{size:A4 portrait;margin:8mm}
#app,#login,#shr,#pad,#dm{display:none!important}#pv{display:block}
body{padding:0;background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style></head><body>

<div id="login" class="card"><h2>Overtime Portal</h2>
<input id="em" list="ul" placeholder="Username or email" autocapitalize="none" autocomplete="username"><datalist id="ul"></datalist><div id="chips"></div><input id="pw" type="password" placeholder="Password">
<button onclick="login()" style="width:100%">Sign in</button><p id="lerr" class="err"></p></div>

<div id="app" hidden>
<div id="top"><div class="tb"><b class="brand">Overtime Portal</b><span id="who"></span></div>
<div class="dp"><button class="arr" onclick="step(-1)">&#8249;</button><select id="mon" onchange="refresh()"></select><input id="yr" type="number" onchange="refresh()"><button class="arr" onclick="step(1)">&#8250;</button></div>
<div id="tiles"></div></div>
<div id="main">
<div id="list" class="card" hidden></div><div id="cal" class="card" hidden></div>
<div id="staff" class="card" hidden><h3 id="fh">Create user</h3>
<div class="fg"><input id="nn" placeholder="Full name"><input id="ne" placeholder="Employee no."><input id="nm" placeholder="Username" autocapitalize="none"><input id="np" placeholder="Temp password (6+)">
<select id="nr"><option value="employee">Employee</option><option value="manager">Manager</option></select></div>
<div style="margin-top:8px"><button id="sb" onclick="mkUser()">Create</button><button id="cb" class="o" onclick="clearForm()" hidden>Cancel</button> <small id="smsg" class="mu"></small></div>
<div id="slist" style="margin-top:18px;overflow-x:auto"></div></div>
<div id="bar" class="card" hidden></div><div id="sheet" hidden></div></div>
<div id="nav"><div class="hm"><button id="homeB" onclick="home()" aria-label="Home"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/></svg></button><button class="bk" onclick="back()">&#8249; Back</button></div>
<button class="out" onclick="auth.signOut()">Log out</button></div></div>

<div id="shr" hidden onclick="if(event.target==this)this.hidden=true"><div class="mdl"><h3>Share timesheet</h3>
<button onclick="shr('p')">Print</button><button onclick="shr('d')">Download PDF</button><button onclick="shr('s')">Share via WhatsApp, email&hellip;</button><button class="o" onclick="$('shr').hidden=true">Close</button></div></div>
<div id="dm" hidden onclick="if(event.target==this)this.hidden=true"></div>
<div id="pad" hidden><div style="background:#fff;padding:12px;border-radius:8px">
<canvas id="cv" width="420" height="160"></canvas><br>
<button onclick="padSave()">Save signature</button><button class="g" onclick="padClear()">Clear</button><button class="r" onclick="$('pad').hidden=true">Cancel</button></div></div>

<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-app-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-auth-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyAVIDXSwX1y6YduUstziGH2T5ZAVyXJdi4",authDomain:"overtime-fae11.firebaseapp.com",projectId:"overtime-fae11",storageBucket:"overtime-fae11.firebasestorage.app",messagingSenderId:"764390438830",appId:"1:764390438830:web:9b6412906950c039327a3f"};
const OT_THRESHOLD=195,NIGHT_DOUBLE_CAP=6;
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(),db=firebase.firestore(),$=id=>document.getElementById(id);
const MON=["January","February","March","April","May","June","July","August","September","October","November","December"];
const DAY=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
let CD,me,cur,staff={},H=[],editId=null,hist=[],scr=null,P={y:new Date().getFullYear(),m:new Date().getMonth()};
$('mon').innerHTML=MON.map((n,i)=>`<option value="${i}">${n}</option>`).join('');$('mon').value=P.m;$('yr').value=P.y;
const rd=()=>{P.m=+$('mon').value;P.y=+$('yr').value},f2=n=>(n||0).toFixed(2),f=n=>n?n.toFixed(2):'',bd=x=>`<span class="b ${x}">${x}</span>`;
const DOM='@overtime.app';
async function loadNames(){let n=[],ok=false;try{n=JSON.parse(localStorage.getItem('uns')||'[]')}catch(e){}
 try{const q=await db.collection('usernames').get();n=q.docs.map(d=>d.id);ok=true;localStorage.setItem('uns',JSON.stringify(n))}catch(e){}
 n=[...new Set(n)].sort();$('ul').innerHTML=n.map(x=>`<option value="${x}">`).join('');
 $('chips').innerHTML=n.map(x=>`<span class="chip" onclick="$('em').value='${x}';$('pw').focus()">${x}</span>`).join('')}
loadNames();
const say=t=>{const e=$('msg');if(e)e.textContent=t};

/* ---------- navigation ---------- */
function go(fn,...a){if(scr)hist.push(scr);scr=[fn,a];fn(...a)}
function back(){const p=hist.pop();if(p){scr=p;p[0](...p[1])}}
function home(){hist=[];scr=null;go(me.role=='manager'?loadList:showCal)}
function step(d){let m=+$('mon').value+d,y=+$('yr').value;if(m<0){m=11;y--}if(m>11){m=0;y++}$('mon').value=m;$('yr').value=y;refresh()}
function refresh(){rd();scr&&scr[0](...scr[1])}
function view(v,t){['list','cal','staff'].forEach(x=>$(x).hidden=x!=v);$('sheet').hidden=$('bar').hidden=true;
 if(t)[...$('tiles').children].forEach(e=>e.classList.toggle('on',e.dataset.t==t));window.scrollTo(0,0)}

/* ---------- auth ---------- */
function login(){$('lerr').textContent='';const v=$('em').value.trim().toLowerCase();
 auth.signInWithEmailAndPassword(v.includes('@')?v:v+DOM,$('pw').value).catch(e=>$('lerr').textContent=e.code=='auth/invalid-credential'?'Incorrect username or password.':e.message)}
auth.onAuthStateChanged(async u=>{
 if(!u){me=null;$('app').hidden=true;$('login').hidden=false;loadNames();return}
 const s=await db.collection('users').doc(u.uid).get();
 if(!s.exists){$('lerr').textContent='Account not set up. Contact management.';auth.signOut();return}
 me={uid:u.uid,...s.data()};staff={};$('who').textContent=`${me.name} · ${me.role}`;
 const mg=me.role=='manager',tabs=mg?[['Timesheets',loadList],['History',showHistory],['Staff',showStaff]]:[['Calendar',showCal],['History',showHistory]];
 $('tiles').innerHTML=tabs.map(t=>`<div class="tile" data-t="${t[0]}">${t[0]}</div>`).join('');
 [...$('tiles').children].forEach((el,i)=>el.onclick=()=>go(tabs[i][1]));
 $('login').hidden=true;$('app').hidden=false;home();
});
async function ld(){staff={};(await db.collection('users').get()).forEach(d=>staff[d.id]=d.data())}
const err=(id,e)=>{$(id).hidden=false;$(id).innerHTML='<p class="err">'+e.message+'</p>'};
function openAt(u,y,m){$('yr').value=y;$('mon').value=m;go(openSheet,u)}

/* ---------- manager: timesheets ---------- */
async function loadList(){view('list','Timesheets');rd();
 try{await ld();
 const ts=await db.collection('timesheets').where('ym','==',`${P.y}-${P.m+1}`).get(),st={};ts.forEach(d=>st[d.data().uid]=d.data());
 const ids=Object.keys(staff).filter(i=>staff[i].role!='manager'),c=k=>ids.filter(i=>(st[i]||{}).status==k).length;
 $('list').innerHTML=`<h3>${MON[P.m]} ${P.y}</h3><div class="stats"><div class="stat"><b>${ids.length}</b><span>Staff</span></div><div class="stat"><b>${c('submitted')}</b><span>Awaiting approval</span></div><div class="stat"><b>${c('approved')}</b><span>Approved</span></div><div class="stat"><b>${ids.length-c('submitted')-c('approved')}</b><span>Not submitted</span></div></div>
 <table class="dt"><tr><th>Employee</th><th>Emp no.</th><th>Status</th><th>Total hrs</th><th>2.0 hrs</th><th>1.5 hrs</th><th></th></tr>`+ids.map(i=>{const t=st[i]||{};
 return `<tr><td>${staff[i].name}</td><td>${staff[i].empNo||''}</td><td>${bd(t.status||'none')}</td><td>${f2(t.tot)}</td><td>${f2(t.dbl)}</td><td>${f2(t.o15)}</td><td><button onclick="go(openSheet,'${i}')">Open</button></td></tr>`}).join('')+'</table>';
 }catch(e){err('list',e)}}

/* ---------- history (all past sheets) ---------- */
async function showHistory(){view('list','History');const mg=me.role=='manager';
 try{if(mg)await ld();
 const q=await(mg?db.collection('timesheets'):db.collection('timesheets').where('uid','==',me.uid)).get();
 const ym=x=>{const[a,b]=x.ym.split('-').map(Number);return a*12+b};
 H=q.docs.map(x=>x.data()).sort((a,b)=>ym(b)-ym(a));
 $('list').innerHTML='<div class="bar2"><h3>History</h3>'+(mg?`<select id="hf" onchange="histRows()"><option value="">All employees</option>${Object.entries(staff).filter(([,s])=>s.role!='manager').map(([i,s])=>`<option value="${i}">${s.name}</option>`).join('')}</select>`:'')+'</div><div id="hr"></div>';histRows()}catch(e){err('list',e)}}
function histRows(){const fl=$('hf')?$('hf').value:'',mg=me.role=='manager',r=H.filter(d=>!fl||d.uid==fl);
 $('hr').innerHTML=r.length?`<table class="dt"><tr>${mg?'<th>Employee</th>':''}<th>Month</th><th>Status</th><th>Total</th><th>2.0</th><th>1.5</th><th></th></tr>`+r.map(d=>{const[y,m]=d.ym.split('-').map(Number);
 return `<tr>${mg?`<td>${(staff[d.uid]||{}).name||'—'}</td>`:''}<td>${MON[m-1]} ${y}</td><td>${bd(d.status)}</td><td>${f2(d.tot)}</td><td>${f2(d.dbl)}</td><td>${f2(d.o15)}</td><td><button onclick="openAt('${d.uid}',${y},${m-1})">View</button></td></tr>`}).join('')+'</table>':'<p class="mu">No timesheets yet.</p>'}

/* ---------- employee calendar ---------- */
async function showCal(){view('cal','Calendar');rd();
 try{const s=await db.collection('timesheets').doc(`${me.uid}_${P.y}-${P.m+1}`).get();CD={id:`${me.uid}_${P.y}-${P.m+1}`,d:s.exists?s.data():{uid:me.uid,ym:`${P.y}-${P.m+1}`,e:{},status:'draft',auth:'',mgrName:''}};const d=CD.d;
 const n=new Date(P.y,P.m+1,0).getDate(),off=(new Date(P.y,P.m,1).getDay()+6)%7,now=new Date();let c='';
 ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].forEach(x=>c+=`<div class="ch">${x}</div>`);
 for(let i=0;i<off;i++)c+='<div></div>';
 for(let i=1;i<=n;i++){const r=calc(i,(d.e||{})[i]||{}),w=new Date(P.y,P.m,i).getDay();
  c+=`<div onclick="dayEdit(${i})" class="cd${r?' w':''}${w==0?' su':''}${now.getFullYear()==P.y&&now.getMonth()==P.m&&now.getDate()==i?' td':''}">${i}${((d.e||{})[i]||{}).ph?' <small>PH</small>':''}${r?`<b>${r.h.toFixed(1)}h</b>`:''}</div>`}
 $('cal').innerHTML=`<div class="bar2"><h3>${MON[P.m]} ${P.y}</h3>${bd(d.status)}</div><div class="cg">${c}</div>
 <div class="bar2" style="margin-top:14px"><span class="mu">Total <b>${f2(d.tot)}</b> hrs · 2.0: <b>${f2(d.dbl)}</b> · 1.5: <b>${f2(d.o15)}</b></span><button onclick="go(openSheet,me.uid)">Open timesheet</button></div>`}catch(e){err('cal',e)}}

/* ---------- staff management ---------- */
async function showStaff(){view('staff','Staff');
 try{await ld();$('slist').innerHTML='<h3>Staff</h3><table class="dt"><tr><th>Name</th><th>Emp no.</th><th>Username</th><th>Role</th><th></th></tr>'+Object.entries(staff).map(([i,u])=>
 `<tr><td>${u.name}</td><td>${u.empNo||''}</td><td>${u.username||u.email}</td><td>${u.role}</td><td style="white-space:nowrap"><button class="o" onclick="editU('${i}')">Edit</button>${u.email.endsWith(DOM)?'':`<button class="o" onclick="resetPw('${i}')">Reset password</button>`}${i==me.uid?'':`<button class="r" onclick="delU('${i}')">Delete</button>`}</td></tr>`).join('')+'</table>'}catch(e){err('slist',e)}}
function clearForm(){editId=null;['nn','ne','nm','np'].forEach(i=>{$(i).value='';$(i).disabled=false});$('nr').value='employee';$('fh').textContent='Create user';$('sb').textContent='Create';$('cb').hidden=true}
function editU(id){const u=staff[id];editId=id;$('nn').value=u.name;$('ne').value=u.empNo||'';$('nm').value=u.username||u.email;$('nm').disabled=$('np').disabled=true;$('np').value='';$('nr').value=u.role;
 $('fh').textContent='Edit user';$('sb').textContent='Save changes';$('cb').hidden=false;window.scrollTo(0,0)}
async function mkUser(){
 try{if(editId)await db.collection('users').doc(editId).update({name:$('nn').value,empNo:$('ne').value,role:$('nr').value});
 else{const app=firebase.apps.find(a=>a.name=='sec')||firebase.initializeApp(firebaseConfig,'sec');
  const un=$('nm').value.trim().toLowerCase();if(!/^[a-z0-9._-]{3,}$/.test(un))throw new Error('Username: 3+ letters/numbers, no spaces.');
  const c=await app.auth().createUserWithEmailAndPassword(un+DOM,$('np').value);
  await db.collection('users').doc(c.user.uid).set({name:$('nn').value,empNo:$('ne').value,username:un,email:un+DOM,role:$('nr').value});await app.auth().signOut();
  try{await db.collection('usernames').doc(un).set({name:$('nn').value})}catch(e){}
  let l=[];try{l=JSON.parse(localStorage.getItem('uns')||'[]')}catch(e){}localStorage.setItem('uns',JSON.stringify([...new Set([...l,un])]))}
 clearForm();$('smsg').textContent='Saved.';showStaff()}catch(e){$('smsg').textContent=e.message}}
async function delU(id){if(!confirm(`Delete ${staff[id].name} and all their timesheets? This cannot be undone.`))return;
 const q=await db.collection('timesheets').where('uid','==',id).get(),b=db.batch();q.forEach(d=>b.delete(d.ref));b.delete(db.collection('users').doc(id));await b.commit();try{await db.collection('usernames').doc(staff[id].username||'_').delete()}catch(e){}showStaff()}
function resetPw(id){auth.sendPasswordResetEmail(staff[id].email).then(()=>alert('Password reset email sent to '+staff[id].email),e=>alert(e.message))}

/* ---------- timesheet ---------- */
async function openSheet(uid){try{await openSheet2(uid)}catch(e){view(null);err('sheet',e)}}
async function openSheet2(uid){
 view(null);rd();
 const prof=uid==me.uid?me:(staff[uid]||(await db.collection('users').doc(uid).get()).data());
 const id=`${uid}_${P.y}-${P.m+1}`,s=await db.collection('timesheets').doc(id).get();

 <div><b>EMPLOYEE NO.:</b><span class="g">${p.empNo||''}</span></div>
 <div><b>DATE OF SUBMISSION:</b><span class="g">${d.subDate||''}</span></div>
 <div><b>MONTH:</b><span class="g">${MON[P.m]}</span></div>
 <div><b>DEPARTMENT MANAGER'S SIGNATURE:</b><span class="g">${sig('mgrSig')}</span></div>
 <div><b>YEAR:</b><span class="g">${P.y}</span></div>
 <div><b>EMPLOYEE'S SIGNATURE:</b><span class="g">${sig('empSig')}</span></div></div>
 <table><tr><th>DATE</th><th>Day</th><th>START TIME</th><th>END TIME</th><th>Total Hours Worked</th><th>2 O/TIME</th><th>1.5 O/TIME</th><th>Public Holiday</th><th>Night shift</th><th>Remarks</th></tr>${r}
 <tr class="tot"><td colspan="4" style="text-align:right">Total Hours</td><td id="TH"></td><td id="TD"></td><td id="T15"></td><td id="TP"></td><td id="TN"></td><td id="TR" style="font-size:8px;line-height:1.1"></td></tr></table>
 <div class="f" style="grid-template-columns:auto"><div><b style="width:150px">OVERTIME AUTHORISED:</b>${m&&d.status!='approved'?`<select class="g" style="flex:none;width:110px" onchange="cur.d.auth=this.value"><option value="">—</option><option ${d.auth=='YES'?'selected':''}>YES</option><option ${d.auth=='NO'?'selected':''}>NO</option></select>`:`<span class="g" style="flex:none;width:110px">${d.auth||''}</span>`}<small class="mu">Status: ${d.status}</small></div></div>`;
 const grp=h=>h?`<div class="grp">${h}</div>`:'';
 $('bar').innerHTML=(own&&E?'<div class="hint">Enter start and end times for each day worked, tick Public Holiday where needed, then Save, Sign and Submit to management.</div>':'')+
  grp((E?'<button onclick="save()">Save</button>':'')+(own&&E?'<button class="o" onclick="pad(\'empSig\')">Sign</button><button onclick="submitS()">Submit to management</button>':''))+
  (m?grp('<button class="o" onclick="pad(\'mgrSig\')">Sign</button><button onclick="approve()">Verify &amp; approve</button><button class="r" onclick="ret()">Return to employee</button>'):'')+
  '<button class="o sh" onclick="$(\'shr\').hidden=false">Share</button><span id="msg" class="mu"></span>';
 $('sheet').hidden=$('bar').hidden=false;recompute();
}
function chg(el){const i=el.dataset.d,k=el.dataset.k;(cur.d.e[i]=cur.d.e[i]||{})[k]=k=='ph'?el.checked:el.value;recompute()}
function recompute(){
 const n=new Date(P.y,P.m+1,0).getDate();let Ht=0,D=0,PH=0,N=0;
 for(let i=1;i<=n;i++){const c=calc(i,cur.d.e[i]||{});
  $('h'+i).textContent=c?f(c.h):'';$('d'+i).textContent=c?f(c.dbl):'';$('n'+i).textContent=c?f(c.ni):'';
  if(c){Ht+=c.h;D+=c.dbl;PH+=c.ph;N+=c.ni}}
 const o15=Math.max(0,Ht-OT_THRESHOLD);Object.assign(cur.d,{tot:Ht,dbl:D,o15});
 $('TH').textContent=Ht.toFixed(2);$('TD').textContent=D.toFixed(2);$('T15').textContent=o15.toFixed(2);$('TP').textContent=PH.toFixed(2);$('TN').textContent=N.toFixed(2);$('TR').textContent=Ht>OT_THRESHOLD?`Exceeded monthly hours by ${+(Ht-OT_THRESHOLD).toFixed(2)} hours`:'';
}
async function save(){try{await db.collection('timesheets').doc(cur.id).set(cur.d);say('Saved ✔')}catch(e){say(e.message)}}
async function submitS(){if(!cur.d.empSig)return say('Please sign first.');
 cur.d.status='submitted';cur.d.subDate=new Date().toISOString().slice(0,10);await save();render();say('Submitted to management ✔')}
async function approve(){if(!cur.d.mgrSig)return say('Manager signature required.');if(!cur.d.auth)return say('Select overtime authorised YES/NO.');
 cur.d.status='approved';await save();render();say('Approved ✔')}
async function ret(){cur.d.status='draft';cur.d.mgrSig='';await save();render();say('Returned to employee')}

/* ---------- share / print / pdf ---------- */
const esc=x=>String(x||'').replace(/"/g,'&quot;');
function tots(e){let tot=0,dbl=0;for(const k in e){const c=calc(+k,e[k]);if(c){tot+=c.h;dbl+=c.dbl}}return{tot,dbl,o15:Math.max(0,tot-OT_THRESHOLD)}}
function dayEdit(i){const e=CD.d.e[i]||{},lk=['submitted','approved'].includes(CD.d.status),x=lk?'disabled':'';
 $('dm').innerHTML=`<div class="mdl"><h3>${DAY[new Date(P.y,P.m,i).getDay()]}, ${i} ${MON[P.m]} ${P.y}</h3>
 <label>Start time<input type="time" id="ds" value="${e.s||''}" ${x}></label><label>End time<input type="time" id="de" value="${e.e||''}" ${x}></label>
 <label style="flex-direction:row;align-items:center;gap:8px"><input type="checkbox" id="dp" ${e.ph?'checked':''} ${x}> Public holiday</label>
 <label>Remarks<input id="dr" value="${esc(e.r)}" ${x}></label>
 ${lk?'<small class="mu">This timesheet is locked.</small>':`<button onclick="daySave(${i})">Save</button><button class="g" onclick="daySave(${i},1)">Clear day</button>`}
 <button class="o" onclick="$('dm').hidden=true">Close</button></div>`;$('dm').hidden=false}
async function daySave(i,clr){const e=CD.d.e;if(clr)delete e[i];else e[i]={s:$('ds').value,e:$('de').value,ph:$('dp').checked,r:$('dr').value};
 const t=tots(e);Object.assign(CD.d,{tot:t.tot,dbl:t.dbl,o15:t.o15});
 try{await db.collection('timesheets').doc(CD.id).set(CD.d)}catch(x){alert(x.message);return}
 $('dm').hidden=true;showCal()}

/* print + PDF share one static layout */
function buildPv(pdf){const o=$('pv');if(o)o.remove();const src=[...$('sheet').querySelectorAll('input,select')],c=$('sheet').cloneNode(true);
 [...c.querySelectorAll('input,select')].forEach((i,k)=>{const q=src[k],s=document.createElement('span');s.className=i.className;s.style.cssText=i.style.cssText;s.textContent=q.type=='checkbox'?(q.checked?'✓':''):q.value;i.replaceWith(s)});
 c.querySelectorAll('.mu').forEach(e=>e.remove());c.querySelectorAll('[id]').forEach(e=>e.removeAttribute('id'));['id','hidden','style'].forEach(a=>c.removeAttribute(a));c.className='pp';
 if(pdf)c.style.cssText='position:fixed;left:-9999px;top:0;width:740px';else c.id='pv';
 document.body.appendChild(c);return c}
const fname=()=>`Overtime_${cur.prof.name.replace(/\s+/g,'_')}_${MON[P.m]}_${P.y}.pdf`;
async function mkPdf(){const c=buildPv(true),cv=await html2canvas(c,{scale:3,backgroundColor:'#fff'});c.remove();
 const pdf=new window.jspdf.jsPDF('p','mm','a4'),W=194,Hh=281;let w=W,h=cv.height*W/cv.width;if(h>Hh){h=Hh;w=cv.width*Hh/cv.height}
 pdf.addImage(cv.toDataURL('image/jpeg',.95),'JPEG',(210-w)/2,8,w,h);return pdf}
async function shr(k){$('shr').hidden=true;
 try{if(k=='p'){buildPv();setTimeout(()=>window.print(),150);return}
 say('Preparing PDF…');const pdf=await mkPdf();
 if(k=='d'){pdf.save(fname());say('PDF downloaded');return}
 const file=new File([pdf.output('blob')],fname(),{type:'application/pdf'});
 if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Overtime Form'});say('')}
 else{pdf.save(fname());say('Sharing not supported here – PDF downloaded instead.')}}catch(e){say(e.name=='AbortError'?'':e.message)}}
window.onbeforeprint=()=>{if(cur&&!$('sheet').hidden)buildPv()};

/* ---------- signature pad ---------- */
let key,drawing=false;const cv=$('cv'),cx=cv.getContext('2d');
function pad(k){key=k;padClear();$('pad').hidden=false}
function padClear(){cx.clearRect(0,0,cv.width,cv.height)}
function padSave(){cur.d[key]=cv.toDataURL();$('pad').hidden=true;render()}
const pos=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]};
cv.onpointerdown=e=>{drawing=true;cx.beginPath();cx.moveTo(...pos(e))};
cv.onpointermove=e=>{if(drawing){cx.lineWidth=2;cx.lineTo(...pos(e));cx.stroke()}};
cv.onpointerup=cv.onpointerleave=()=>drawing=false;
</script></body></html>
